<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AuraSense — Create your account to start monitoring your health.">
    <title>AuraSense — Sign Up</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
</head>

<body>

    <!-- ── Animated Background Scene ── -->
    <div class="bg-scene">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="ecg-container">
            <svg class="ecg-line" viewBox="0 0 2400 120" preserveAspectRatio="none">
                <path
                    d="M0,60 L80,60 L100,60 L120,20 L140,100 L160,40 L180,80 L200,60 L300,60 L320,60 L340,20 L360,100 L380,40 L400,80 L420,60 L520,60 L540,60 L560,20 L580,100 L600,40 L620,80 L640,60 L740,60 L760,60 L780,20 L800,100 L820,40 L840,80 L860,60 L960,60 L980,60 L1000,20 L1020,100 L1040,40 L1060,80 L1080,60 L1180,60 L1200,60 L1220,20 L1240,100 L1260,40 L1280,80 L1300,60 L1400,60 L1420,60 L1440,20 L1460,100 L1480,40 L1500,80 L1520,60 L1620,60 L1640,60 L1660,20 L1680,100 L1700,40 L1720,80 L1740,60 L1840,60 L1860,60 L1880,20 L1900,100 L1920,40 L1940,80 L1960,60 L2060,60 L2080,60 L2100,20 L2120,100 L2140,40 L2160,80 L2180,60 L2280,60 L2300,60 L2320,20 L2340,100 L2360,40 L2380,80 L2400,60" />
            </svg>
        </div>
    </div>

    <!-- ── Top Bar ── -->
    <nav class="topbar" style="background: transparent; border-bottom: none; backdrop-filter: none;">
        <div class="topbar-logo">
            <img src="assets/logo-placeholder.svg" alt="AuraSense Logo" onerror="this.style.display='none'">
            <span class="brand">AURASENSE</span>
        </div>
    </nav>

    <!-- ── Sign Up Card ── -->
    <div class="auth-wrapper">
        <div class="auth-card glass-card" style="max-width: 480px;">
            <div class="card-icon">🧬</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join AuraSense and start your health journey</p>

            <div id="signup-alert" class="alert"></div>

            <form id="signup-form" onsubmit="signUpWithEmail(event)">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="signup-name" placeholder="John Doe" required autocomplete="name">
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label for="signup-age">Age</label>
                        <div class="input-wrapper">
                            <input type="number" id="signup-age" placeholder="25" min="1" max="150" required>
                            <span class="input-icon">📅</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signup-gender">Gender</label>
                        <div class="input-wrapper">
                            <select id="signup-gender" required>
                                <option value="" disabled selected>Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <span class="input-icon">⚥</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="signup-email" placeholder="you@example.com" required
                            autocomplete="email">
                        <span class="input-icon">✉</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signup-password" placeholder="Min 6 characters" required
                            minlength="6" autocomplete="new-password">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <!-- Guardian Information -->
                <div
                    style="margin: 24px 0 8px; font-size: 0.8rem; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 1px;">
                    Guardian Information</div>

                <div class="form-group">
                    <label for="signup-guardian-name">Guardian Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="signup-guardian-name" placeholder="Guardian's full name" required>
                        <span class="input-icon">🛡️</span>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label for="signup-guardian-phone">Guardian Phone</label>
                        <div class="input-wrapper">
                            <input type="tel" id="signup-guardian-phone" placeholder="10-digit number" required
                                pattern="[0-9]{10}" maxlength="10">
                            <span class="input-icon">📞</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signup-guardian-email">Guardian Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="signup-guardian-email" placeholder="guardian@email.com" required>
                            <span class="input-icon">📧</span>
                        </div>
                    </div>
                </div>

                <!-- Medical Information -->
                <div
                    style="margin: 24px 0 8px; font-size: 0.8rem; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 1px;">
                    Medical Information</div>

                <div class="form-group">
                    <label for="signup-medical">Medical Abnormalities / Conditions</label>
                    <div class="input-wrapper">
                        <textarea id="signup-medical" rows="3" placeholder="e.g. Diabetes, Allergies, Hypertension..."
                            style="
                            width: 100%;
                            padding: 13px 16px;
                            background: rgba(255, 255, 255, 0.04);
                            border: 1px solid var(--color-border);
                            border-radius: var(--radius-md);
                            color: var(--color-text);
                            font-size: 0.95rem;
                            outline: none;
                            resize: vertical;
                            font-family: var(--font-body);
                            transition: all var(--transition-fast);
                        "></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="patient-login.html">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        redirectIfLoggedIn();
    </script>
</body>

</html>
